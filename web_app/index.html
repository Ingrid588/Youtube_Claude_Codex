<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 视频朗读 - 多语言字幕朗读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: #667eea;
            border-radius: 2px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        input[type="text"],
        input[type="url"],
        select {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls button {
            flex: 1;
            padding: 12px;
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 12px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .subtitle-list {
            background: #f5f5f5;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
        }

        .subtitle-item {
            padding: 8px;
            background: white;
            margin-bottom: 6px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
            font-size: 13px;
            line-height: 1.4;
        }

        .subtitle-time {
            color: #999;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .subtitle-text {
            color: #333;
        }

        .player-section {
            background: #f9f9f9;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .player-info {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
            text-align: center;
        }

        audio {
            width: 100%;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-bottom: 12px;
        }

        .voice-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .voice-option {
            padding: 12px;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 14px;
        }

        .voice-option:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .voice-option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .language-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .lang-btn {
            padding: 8px 12px;
            background: #f0f0f0;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            border-color: #667eea;
        }

        .lang-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .sync-hint {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            color: #856404;
            margin-bottom: 12px;
            display: none;
        }

        .sync-hint.show {
            display: block;
        }

        .gen-progress {
            margin-top: 14px;
        }

        .gen-progress-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 6px;
        }

        .yt-player-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            margin-bottom: 12px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            display: none;
        }

        .yt-player-wrap iframe,
        .yt-player-wrap > div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 600px) {
            .voice-selector {
                grid-template-columns: 1fr;
            }

            .input-group {
                flex-direction: column;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 YouTube 视频朗读</h1>
            <p>按你选的语言抓取视频自带字幕，直接朗读，双页同步播放</p>
        </div>

        <div class="content">
            <!-- 第一步：输入链接 + 选朗读语言 -->
            <div class="section">
                <div class="section-title">步骤 1：输入视频链接</div>
                <div class="input-group">
                    <input type="url" id="urlInput" placeholder="粘贴 YouTube 视频链接 (https://www.youtube.com/watch?v=...)" />
                </div>

                <label style="font-size: 13px; color: #666; margin-bottom: 8px; display: block;">选择朗读语言（决定去抓哪个语言的字幕）：</label>
                <div class="language-selector" id="langSelector"></div>

                <label style="font-size: 13px; color: #666; margin-bottom: 8px; display: block; margin-top: 12px;">选择朗读音色：</label>
                <div class="voice-selector" id="voiceSelector"></div>

                <button id="fetchBtn" style="width: 100%; margin-top: 12px; padding: 12px;">获取字幕</button>
                <div class="status" id="status"></div>
            </div>

            <!-- 第二步：字幕预览 -->
            <div class="section">
                <div class="section-title">步骤 2：字幕预览</div>
                <div class="subtitle-list" id="subtitleList" style="display: none;"></div>
                <div id="subtitleCount" style="font-size: 13px; color: #999;"></div>
            </div>

            <!-- 第三步：生成朗读 -->
            <div class="section">
                <div class="section-title">步骤 3：生成朗读</div>

                <button id="generateBtn" style="width: 100%; padding: 12px;" disabled>
                    生成朗读
                </button>

                <div class="gen-progress" id="genProgress" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="genProgressFill"></div>
                    </div>
                    <div class="gen-progress-text" id="genProgressText">0 / 0</div>
                </div>
            </div>

            <!-- 第四步：播放 -->
            <div class="section">
                <div class="section-title">步骤 4：播放朗读</div>

                <div class="sync-hint" id="syncHint">
                    💡 朗读生成后，点击"启动同步"即可与下方嵌入的视频同步播放（视频画面 + 朗读音轨）。
                </div>

                <div class="yt-player-wrap" id="ytPlayerWrap">
                    <div id="ytPlayer"></div>
                </div>

                <div class="player-section">
                    <div class="player-info" id="playerInfo" style="display: none;"></div>
                    <audio id="audioPlayer" controls></audio>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display" id="timeDisplay">00:00 / 00:00</div>

                    <div class="controls">
                        <button id="syncBtn" style="display: none;">🔗 启动同步</button>
                        <button id="downloadBtn" style="display: none;">⬇️ 下载朗读音频</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
